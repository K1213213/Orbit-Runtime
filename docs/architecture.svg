<text x="925" y="1034" text-anchor="middle" font-size="12" fill="#475569">宿主注入的能力裁决</text>
<rect x="1070" y="994" width="220" height="52" rx="8" fill="#E2E8F0"/>
<text x="1180" y="1016" text-anchor="middle" font-size="14" font-weight="600" fill="#1E293B">LlmMockChannel</text>
<text x="1180" y="1034" text-anchor="middle" font-size="12" fill="#475569">simulateChatRound</text>
<rect x="1320" y="994" width="200" height="52" rx="8" fill="#F3E8FF"/>
<text x="1420" y="1016" text-anchor="middle" font-size="14" font-weight="600" fill="#5B21B6">TraceJournal</text>
<text x="1420" y="1034" text-anchor="middle" font-size="12" fill="#475569">append</text>

<g font-size="13" fill="#334155">
<line x1="190" y1="1046" x2="420" y2="1046" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrGray)"/>
<text x="300" y="1064" text-anchor="middle" font-size="12">① runSingleCycle(input)</text>

<line x1="540" y1="1090" x2="660" y2="1090" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrGray)"/>
<text x="600" y="1108" text-anchor="middle" font-size="12">② fireChannelCall(LLM_ACCESS)</text>
<text x="430" y="1090" font-size="12" fill="#475569">traceMarkId = gen(); cycleCount++</text>

<line x1="780" y1="1134" x2="900" y2="1134" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrAmber)"/>
<text x="840" y="1152" text-anchor="middle" font-size="12">③ gate? hasCapability</text>
<text x="840" y="1168" text-anchor="middle" font-size="11.5" fill="#B45309">仅当 ctx.pluginUnitId 存在</text>

<line x1="1030" y1="1180" x2="1160" y2="1180" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrGray)"/>
<text x="1095" y="1198" text-anchor="middle" font-size="12">④ simulateChatRound(prompt)</text>
<text x="1095" y="1214" text-anchor="middle" font-size="11.5" fill="#B45309">超时截断保护 maxWaitMs</text>

<line x1="1180" y1="1230" x2="660" y2="1230" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrGray)"/>
<text x="920" y="1248" text-anchor="middle" font-size="12">⑤ 返回 llmOutput（通道封装，沙箱不直接依赖 LLM）</text>

<line x1="540" y1="1270" x2="1405" y2="1270" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrGray)" stroke-dasharray="6 4"/>
<text x="975" y="1288" text-anchor="middle" font-size="12">⑥ journal.append(AGENT_SINGLE_CYCLE_EXEC) — 全关键行为落轨迹</text>
</g>

<text x="90" y="1296" font-size="12.5" fill="#DC2626" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Arial, sans-serif">异常路径：③ gate 拒绝 → ChannelCallFaultError · 超时 → 截断 · cycleCount &gt; maxCycleRun → CycleLimitReachedError（均带 traceMarkId 可溯源）</text>

<!-- ===================== ④ 生命周期 ===================== -->
<text x="60" y="1352" font-size="24" font-weight="700" fill="#0F172A" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Arial, sans-serif">④ 生命周期 — boot（自底向上）/ shutdown（自顶向下反向释放）</text>
