name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Strict compile
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Console tests (web, node:test)
        run: npm run test:console
      - name: Docsite tests + build (zero-dependency renderer)
        run: npm run test:docsite && npm run docsite

      - name: Examples (custom channel / PAE / MCP / CLI loop)
        run: |
          node examples/custom-channel.mjs
          node examples/js-pae-plugin.mjs
          node examples/mcp-adapter.mjs
          node examples/cli-record-replay.mjs
          node examples/langgraph-orchestration.mjs

      - name: Benchmark smoke (each suite runs to completion)
        run: |
          N=2000 node benchmarks/gateway.mjs
          N=10000 node benchmarks/replay.mjs
          N=5000 node benchmarks/wal.mjs
          N=200 node benchmarks/pae.mjs

      - name: Demos (lifecycle + deterministic replay)
        run: |
          npm run demo
          npm run demo:replay

      - name: orbit CLI smoke (record → replay → diff)
        run: |
          node bin/orbit.mjs --version
          mkdir -p .ci-smoke
          printf 'export default async (ctx) => { await ctx.llm.chat("hi"); await ctx.call(ctx.ChannelKind.MEM_KV_STORE, "readEntry", "k"); }\n' > .ci-smoke/s.mjs
          node bin/orbit.mjs record .ci-smoke/s.mjs --out .ci-smoke/t.jsonl
          node bin/orbit.mjs replay .ci-smoke/t.jsonl
          node bin/orbit.mjs diff .ci-smoke/t.jsonl .ci-smoke/t.jsonl
          rm -rf .ci-smoke
