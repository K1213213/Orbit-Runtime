<text x="430" y="1034" text-anchor="middle" font-size="12" fill="#475569">runSingleCycle</text>
<rect x="570" y="994" width="210" height="52" rx="8" fill="#DBEAFE"/>
<text x="675" y="1016" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A8A">ChannelHub</text>
<text x="675" y="1034" text-anchor="middle" font-size="12" fill="#475569">fireChannelCall</text>
