<!DOCTYPE html>
<html lang="zh-CN" data-motion="on">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit · 多智能体运行控制台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%236366F1' stroke-width='2.5'/%3E%3Cellipse cx='16' cy='16' rx='5.5' ry='13' fill='none' stroke='%2338BDF8' stroke-width='1.5' transform='rotate(60 16 16)'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- 登录 / 注册：未认证时独占视口 -->
  <div id="auth-root" hidden></div>

  <!-- 控制台外壳：顶部全局导航 + 侧栏 + 主区 -->
  <div class="shell" id="shell" hidden>
    <header class="topnav">
      <div class="brand" id="brand-home" title="回到总览">
        <svg class="brand-orb" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3" />
          <ellipse cx="20" cy="20" rx="7" ry="16" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(58 20 20)" />
          <circle cx="20" cy="20" r="2.6" fill="currentColor" />
        </svg>
        <div class="brand-text">
          <strong>Orbit</strong>
          <span>Agent Runtime</span>
        </div>
      </div>

      <div class="topnav-search" id="btn-palette" title="打开命令面板" role="button" tabindex="0">
        <span class="ts-ico">⌕</span>
        <span class="ts-text">搜索视图、任务与动作…</span>
        <kbd>Ctrl</kbd><kbd>K</kbd>
      </div>

      <div class="topnav-right">
        <div class="host-pill" id="host-pill" title="主机运行状态">
          <span class="dot" id="host-dot"></span>
          <span id="host-pill-text">连接中…</span>
        </div>

        <div style="position:relative">
          <button class="icon-btn" id="btn-notify" title="消息通知" aria-label="消息通知">
            <span>🔔</span>
            <span class="bell-badge" id="notify-badge"></span>
          </button>
          <div class="popover" id="notify-pop" style="right:0"></div>
        </div>

        <div class="user-menu">
          <button class="user-btn" id="btn-user" title="个人中心">
            <span class="avatar" id="user-avatar">·</span>
            <span class="u-name" id="user-name">…</span>
            <span class="u-caret">▾</span>
          </button>
          <div class="popover" id="user-pop"></div>
        </div>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <button class="icon-btn sidebar-toggle" id="btn-side-min" title="折叠侧栏">⟨</button>
      <!-- 导航由 app.js 依据 lib.js 的 NAV_GROUPS 生成：声明与入口不会分家 -->
      <nav class="nav" id="nav" aria-label="主导航"></nav>
      <div class="sidebar-foot">
        <span class="port-hint" id="port-hint"></span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 class="page-title" id="page-title">数据总览</h1>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <section class="view" id="view" aria-live="polite"></section>
    </main>
  </div>

  <!-- 命令面板：跳转任何视图、执行任何动作 -->
  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="命令面板">
    <div class="palette-panel">
      <div class="palette-head">
        <span class="palette-ico">⌘</span>
        <input
          id="palette-input"
          class="palette-input"
          type="text"
          placeholder="跳转到视图，或执行动作…"
          autocomplete="off"
          spellcheck="false"
          aria-label="搜索视图或动作"
        />
        <kbd class="palette-esc">Esc</kbd>
      </div>
      <div class="palette-list" id="palette-list" role="listbox" aria-label="结果"></div>
      <div class="palette-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
        <span><kbd>Enter</kbd> 执行</span>
        <span><kbd>Esc</kbd> 关闭</span>
        <span class="palette-tip">直接按 <kbd>/</kbd> 也可唤起</span>
      </div>
    </div>
  </div>

  <div class="toast-root" id="toast-root" aria-live="assertive"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
