<line x1="446" y1="1456" x2="480" y2="1456" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrGreen)"/>
<line x1="642" y1="1456" x2="676" y2="1456" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrGreen)"/>
</g>

<text x="840" y="1412" font-size="15" font-weight="600" fill="#991B1B" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Arial, sans-serif">shutdownHost()</text>
<g font-family="Segoe UI, PingFang SC, Microsoft YaHei, Arial, sans-serif">
