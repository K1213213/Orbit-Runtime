<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit Console · Agent Runtime 管理控制台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2322d3ee' stroke-width='2.5'/%3E%3Cellipse cx='16' cy='16' rx='5.5' ry='13' fill='none' stroke='%23818cf8' stroke-width='1.5' transform='rotate(60 16 16)'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-orb" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3" />
        <ellipse cx="20" cy="20" rx="7" ry="16" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(58 20 20)" />
        <circle cx="20" cy="20" r="2.6" fill="currentColor" />
      </svg>
      <div class="brand-text">
        <strong>Orbit Console</strong>
        <span>Agent Runtime</span>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="主导航">
      <button class="nav-item" data-route="overview"><span class="nav-ico">◈</span>总览</button>
      <button class="nav-item" data-route="plugins"><span class="nav-ico">◱</span>插件注册</button>
      <button class="nav-item" data-route="boxes"><span class="nav-ico">▣</span>沙箱对话</button>
      <button class="nav-item" data-route="channels"><span class="nav-ico">⊡</span>模型通道</button>
      <button class="nav-item" data-route="trace"><span class="nav-ico">≡</span>追踪日志</button>
      <button class="nav-item" data-route="replay"><span class="nav-ico">↻</span>回放台</button>
      <button class="nav-item" data-route="graph"><span class="nav-ico">✧</span>影响域图</button>
      <button class="nav-item" data-route="pae"><span class="nav-ico">❖</span>异构适配</button>
      <button class="nav-item" data-route="routing"><span class="nav-ico">⌁</span>成本路由</button>
    </nav>

    <div class="sidebar-foot">
      <div class="host-pill" id="host-pill" title="主机运行状态">
        <span class="dot" id="host-dot"></span>
        <span id="host-pill-text">连接中…</span>
      </div>
      <span class="port-hint" id="port-hint"></span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 class="page-title" id="page-title">总览</h1>
      <div class="topbar-actions">
        <button class="btn ghost sm" id="btn-restart" title="重启主机：先反序关闭再重新启动内核">
          <span class="ico">⟳</span> 重启主机
        </button>
      </div>
    </header>

    <section class="view" id="view" aria-live="polite"></section>
  </main>

  <div class="toast-root" id="toast-root" aria-live="assertive"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
